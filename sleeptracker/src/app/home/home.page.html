<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Sleeptracker
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Sleeptracker</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="actions">
    <ion-button routerLink="/log-sleep">Log Overnight Sleep</ion-button>
    <ion-button color="secondary" routerLink="/log-sleepiness">Log Sleepiness</ion-button>
  </div>

  <div class="segment-wrap">
    <ion-segment [(ngModel)]="chosenView">
      <ion-segment-button value="all">All</ion-segment-button>
      <ion-segment-button value="overnight">Overnight</ion-segment-button>
      <ion-segment-button value="sleepiness">Sleepiness</ion-segment-button>
    </ion-segment>
  </div>

  @for (item of displayedData; track item.id) {
  <ion-card class="entry-card" [class.sleepiness]="!isOvernight(item)">
    <ion-card-header>
      <ion-card-subtitle>{{ isOvernight(item) ? '🌙 Overnight Sleep' : '⭐ Sleepiness' }}</ion-card-subtitle>
      <ion-card-title>{{ item.dateString() }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>{{ item.summaryString() }}</ion-card-content>
  </ion-card>
  } @empty {
  <ion-card>
    <ion-card-content>Nothing has been logged yet.</ion-card-content>
  </ion-card>
  }
