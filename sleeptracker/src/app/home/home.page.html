<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Sleeptracker
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Sleeptracker</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-button expand="block" routerLink="/log-sleep">Log Overnight Sleep</ion-button>
  <ion-button expand="block" routerLink="/log-sleepiness">Log Sleepiness</ion-button>

  <ion-segment [(ngModel)]="chosenView">
    <ion-segment-button value="all">
      <ion-label>View All Entries</ion-label>
    </ion-segment-button>
    <ion-segment-button value="overnight">
      <ion-label>View Logged Sleep Overnight Entries</ion-label>
    </ion-segment-button>
    <ion-segment-button value="sleepiness">
      <ion-label>View Logged Sleepiness Entries</ion-label>
    </ion-segment-button>
  </ion-segment>

  <ion-list>
    @for (item of displayedData; track item.id) {
    <ion-item>
      <ion-label>
        <h2>{{ item.dateString() }}</h2>
        <p>{{ item.summaryString() }}</p>
      </ion-label>
    </ion-item>
    } @empty {
      <ion-item>
        <ion-label>Nothing has been logged yet.</ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
