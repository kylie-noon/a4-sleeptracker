<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Blank
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-button expand="block" routerLink="/log-sleep">Log Overnight Sleep</ion-button>

  <ion-list>
    @for (item of allSleepData; track item.id) {
    <ion-item>
      <ion-label>
        <h2>{{ item.dateString() }}</h2>
        <p>{{ item.summaryString() }}</p>
      </ion-label>
    </ion-item>
    }
  </ion-list>

  </div> -->
</ion-content>
